<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>office — bassmann.ooo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="favicon-animate.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white: #ffffff;
      --black: #000000;
      --link: #0000ee;
      --serif: "Times New Roman", Times, serif;
      --sans: Arial, Helvetica, sans-serif;
    }
    html, body { height: 100%; overflow: hidden; background: #000; }

    #viewer-root { width: 100vw; height: 100vh; }

    /* ── top bar ── */
    .ui-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      pointer-events: none;
    }
    .ui-bar a, .ui-bar button {
      pointer-events: all;
      font-family: var(--sans); font-size: 0.82rem;
      background: none; border: none; cursor: pointer; padding: 4px 0;
      color: rgba(255,255,255,0.8); text-decoration: underline;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }
    .ui-bar a:hover, .ui-bar button:hover { color: #fff; }
    .site-name {
      font-family: var(--serif); font-style: italic; font-size: 1.1rem;
      text-decoration: none; color: rgba(255,255,255,0.75);
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }

    /* ── controls hint ── */
    .hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-family: var(--sans); font-size: 0.72rem;
      color: rgba(255,255,255,0.38); text-align: center;
      pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    /* ── overlay (loading / error / no-file) ── */
    #overlay {
      position: fixed; inset: 0; z-index: 40;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 32px;
    }
    #overlay.hidden { display: none; }
    #overlay-title {
      font-family: var(--sans); font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
    }
    #overlay-sub {
      font-family: var(--sans); font-size: 0.75rem;
      color: rgba(255,255,255,0.35); text-align: center;
      max-width: 340px; line-height: 1.6;
    }
    #progress-bar-wrap {
      width: 180px; height: 2px;
      background: rgba(255,255,255,0.1); border-radius: 1px; overflow: hidden;
    }
    #progress-bar {
      height: 100%; width: 0%; background: rgba(255,255,255,0.5);
      transition: width 0.2s ease; border-radius: 1px;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: rgba(255,255,255,0.55);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ── notice popup ── */
    #notice {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: rgba(0,0,0,0.55);
    }
    #notice.hidden { display: none; }
    .notice-box {
      max-width: 360px; padding: 20px 22px;
      background: rgba(12,12,12,0.92);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 6px;
      font-family: var(--sans); font-size: 0.9rem; line-height: 1.6;
      color: rgba(255,255,255,0.85); text-align: center;
    }
    .notice-box button {
      margin-top: 14px; padding: 4px 18px;
      font-family: var(--sans); font-size: 0.8rem; cursor: pointer;
      color: #fff; background: none;
      border: 1px solid rgba(255,255,255,0.4); border-radius: 3px;
    }
    .notice-box button:hover { border-color: #fff; }
  </style>
</head>
<body>

<div id="viewer-root"></div>

<div id="notice" role="dialog" aria-modal="true" aria-labelledby="notice-text">
  <div class="notice-box">
    <p id="notice-text">Not my actual office, but and office I worked in. My own office coming soon</p>
    <button type="button" id="notice-ok">ok</button>
  </div>
</div>
<script>
  (function () {
    var notice = document.getElementById('notice');
    var ok = document.getElementById('notice-ok');
    function close() { notice.classList.add('hidden'); }
    ok.addEventListener('click', close);
    // clicking the dimmed backdrop or pressing Escape also dismisses it
    notice.addEventListener('click', function (e) { if (e.target === notice) close(); });
    addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    ok.focus();
  })();
</script>

<div class="ui-bar">
  <a href="/">← back</a>
  <a href="/" class="site-name">kurt</a>
</div>

<div class="hint">
  drag to orbit &nbsp;·&nbsp; scroll / pinch to zoom &nbsp;·&nbsp; W A S D to move &nbsp;·&nbsp; right-drag to pan
</div>

<div id="overlay">
  <div class="spinner" id="spinner"></div>
  <span id="overlay-title">loading…</span>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <span id="overlay-sub"></span>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>

<script type="module">
  // ─────────────────────────────────────────────────────────────────
  //  CONFIGURATION — update SPLAT_FILE if you rename your capture
  //  Supported formats: .splat  .ksplat  .ply  .spz
  // ─────────────────────────────────────────────────────────────────
  const SPLAT_FILE = 'Manhattan.spz';

  // Pinned: 0.4.7 ships only build/gaussian-splats-3d.module.js (no .min.js),
  // and it imports the bare specifier 'three', resolved by the import map above
  const CDN = 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';

  const overlay      = document.getElementById('overlay');
  const spinner      = document.getElementById('spinner');
  const titleEl      = document.getElementById('overlay-title');
  const subEl        = document.getElementById('overlay-sub');
  const progressBar  = document.getElementById('progress-bar');
  const progressWrap = document.getElementById('progress-bar-wrap');

  function showError(msg, detail = '') {
    spinner.style.display = 'none';
    progressWrap.style.display = 'none';
    titleEl.textContent = msg;
    titleEl.style.color = 'rgba(255,120,100,0.85)';
    subEl.textContent = detail;
    console.error('[office]', msg, detail);
  }

  // Wrap any promise with a hard timeout so we never hang silently
  function withTimeout(promise, ms, label) {
    const t = new Promise((_, reject) =>
      setTimeout(() => reject(new Error(`timed out after ${ms / 1000}s: ${label}`)), ms)
    );
    return Promise.race([promise, t]);
  }

  // HEAD check with timeout
  async function remoteExists(url) {
    try {
      const r = await withTimeout(fetch(url, { method: 'HEAD' }), 8000, 'HEAD ' + url);
      return r.ok;
    } catch {
      return false;
    }
  }

  // Splats carry baked-in color, so three.js lights can't reach them. Instead we
  // patch the splat shader: each splat is dimmed to an ambient level and then
  // brightened by its distance to a light point that wanders through the room.
  // It's a few multiplies per splat; the cost is that the viewer now redraws
  // every frame instead of only when the camera moves.
  const LIGHT = {
    ambient: 0.3,
    color: [1.0, 0.85, 0.65],   // warm
    intensity: 1.8,
    radius: 0.9,                // distance at which the light's boost halves
    center: [0.0, 0.6, 0.5],    // roughly the middle of the capture
    sweep: [1.4, 0.5, 1.2],     // how far it wanders on each axis
  };

  function addMovingLight(viewer) {
    const material = viewer.splatMesh.material;
    material.uniforms.lightPos = { value: LIGHT.center.slice() };
    material.uniforms.lightColor = { value: LIGHT.color.map(c => c * LIGHT.intensity) };
    material.uniforms.lightAmbient = { value: LIGHT.ambient };
    material.uniforms.lightRadius = { value: LIGHT.radius };
    material.vertexShader = material.vertexShader
      .replace('varying vec4 vColor;', `varying vec4 vColor;
        uniform vec3 lightPos;
        uniform vec3 lightColor;
        uniform float lightAmbient;
        uniform float lightRadius;`)
      .replace('vColor = uintToRGBAVec(sampledCenterColor.r);', `vColor = uintToRGBAVec(sampledCenterColor.r);
            vec3 toLight = (splatCenter - lightPos) / lightRadius;
            vColor.rgb = clamp(vColor.rgb * (lightAmbient + lightColor / (1.0 + dot(toLight, toLight))), 0.0, 1.0);`);
    material.needsUpdate = true;

    const [cx, cy, cz] = LIGHT.center;
    const [sx, sy, sz] = LIGHT.sweep;
    const tick = (ms) => {
      const t = ms / 1000;
      // unrelated frequencies so the path never settles into an obvious loop
      const pos = material.uniforms.lightPos.value;
      pos[0] = cx + sx * Math.sin(t * 0.31);
      pos[1] = cy + sy * Math.sin(t * 0.53 + 1.0);
      pos[2] = cz + sz * Math.cos(t * 0.23);
      material.uniformsNeedUpdate = true;
      viewer.forceRenderNextFrame();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  const fileOk = await remoteExists(SPLAT_FILE);
  if (!fileOk) {
    spinner.style.display = 'none';
    progressWrap.style.display = 'none';
    titleEl.textContent = 'splat file not found';
    subEl.textContent = `Could not reach "${SPLAT_FILE}". Make sure it's deployed alongside this page.`;
  } else {
    titleEl.textContent = 'loading viewer…';

    let GaussianSplats3D;
    try {
      GaussianSplats3D = await withTimeout(import(CDN), 20000, 'CDN import');
    } catch (err) {
      showError('could not load viewer library', err.message);
      throw err;
    }

    if (!GaussianSplats3D?.Viewer) {
      showError('viewer library loaded but Viewer class not found', 'Check browser console for details.');
      throw new Error('No Viewer export');
    }

    titleEl.textContent = 'loading scene…';

    try {
      const viewer = new GaussianSplats3D.Viewer({
        rootElement: document.getElementById('viewer-root'),
        selfDrivenMode: true,
        useBuiltInControls: true,
        // GPU sort leaves the canvas blank in 0.4.7; the CPU worker sort renders fine
        gpuAcceleratedSort: false,
        sharedMemoryForWorkers: false,
      });

      // .spz isn't progressively loadable, so the scene appears only once it's
      // fully downloaded and decoded; our own overlay stands in for the library's UI
      // LoaderStatus isn't exported by the library: 0 = downloading, 1 = processing
      const PROCESSING = 1;
      const onProgress = (percent, _label, status) => {
        if (status === PROCESSING) {
          titleEl.textContent = 'processing…';
          progressBar.style.width = '100%';
          return;
        }
        const p = Math.round(percent);
        titleEl.textContent = `loading… ${p}%`;
        progressBar.style.width = p + '%';
      };

      await withTimeout(
        viewer.addSplatScene(SPLAT_FILE, { showLoadingUI: false, onProgress }),
        120000,
        'addSplatScene'
      );

      addMovingLight(viewer);
      overlay.classList.add('hidden');
      viewer.start();
    } catch (err) {
      showError('error loading scene', err.message);
      console.error('[office] scene error:', err);
    }
  }
</script>

</body>
</html>

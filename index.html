<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bassmann.ooo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 16px;
    font-family: "Courier New", Courier, monospace;
    color: #fff;
    font-size: 1rem;
    z-index: 1;
  }
</style>
</head>
<body>
<header>kurtis bassmann's website</header>
<canvas id="stars"></canvas>
<script>
(function () {
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var W, H, DPR;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = canvas.width = window.innerWidth * DPR;
    H = canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  var COUNT = 300;
  var FOCAL = 480;
  var points = [];

  function rand(min, max) { return min + Math.random() * (max - min); }

  // galaxy-ish distribution: concentrated toward center, flattened on one axis,
  // with a sparser halo of outliers
  for (var i = 0; i < COUNT; i++) {
    var isHalo = Math.random() < 0.15;
    var radius = isHalo ? rand(260, 420) : Math.pow(Math.random(), 1.8) * 260;
    var theta = rand(0, Math.PI * 2);
    var thickness = isHalo ? rand(-120, 120) : rand(-40, 40) * (1 - radius / 300);

    points.push({
      x: Math.cos(theta) * radius,
      y: Math.sin(theta) * radius * 0.55,
      z: thickness + rand(-20, 20),
      size: rand(5, 12),
      phase: rand(0, Math.PI * 2),
      freq: rand(0.4, 1.1),
      amp: rand(4, 14),
      phase2: rand(0, Math.PI * 2),
      freq2: rand(0.3, 0.9)
    });
  }

  // pick 3 random distinct points to become clickable "nav" stars
  var navDefs = [
    { label: 'about', url: 'about.html' },
    { label: 'artwork', url: 'artwork.html' },
    { label: 'other stuff', url: 'other-stuff.html' }
  ];
  var specialIdx = [];
  while (specialIdx.length < navDefs.length) {
    var candidate = Math.floor(Math.random() * points.length);
    if (specialIdx.indexOf(candidate) === -1) specialIdx.push(candidate);
  }
  specialIdx.forEach(function (idx, n) {
    points[idx].special = navDefs[n];
  });

  var mouseX = -9999, mouseY = -9999;
  var hoveredIdx = -1;
  canvas.addEventListener('mousemove', function (e) {
    var rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * DPR;
    mouseY = (e.clientY - rect.top) * DPR;
  });
  canvas.addEventListener('mouseleave', function () {
    mouseX = -9999;
    mouseY = -9999;
  });
  canvas.addEventListener('click', function () {
    if (hoveredIdx !== -1) window.location.href = points[hoveredIdx].special.url;
  });

  var angleY = 0;
  var angleX = 0.3;

  function project(px, py, pz) {
    var scale = FOCAL / (FOCAL + pz);
    return {
      x: W / 2 + px * scale,
      y: H / 2 + py * scale,
      scale: scale
    };
  }

  function rotateY(x, y, z, a) {
    var cosA = Math.cos(a), sinA = Math.sin(a);
    return {
      x: x * cosA + z * sinA,
      y: y,
      z: -x * sinA + z * cosA
    };
  }

  function rotateX(x, y, z, a) {
    var cosA = Math.cos(a), sinA = Math.sin(a);
    return {
      x: x,
      y: y * cosA - z * sinA,
      z: y * sinA + z * cosA
    };
  }

  function draw(t) {
    t *= 0.001;
    ctx.clearRect(0, 0, W, H);
    angleY += 0.0018;

    var drawList = [];

    for (var i = 0; i < points.length; i++) {
      var p = points[i];

      // organic vibration: small per-point wobble in all three axes
      var jx = Math.sin(t * p.freq + p.phase) * p.amp;
      var jy = Math.cos(t * p.freq2 + p.phase2) * p.amp * 0.8;
      var jz = Math.sin(t * p.freq * 0.7 + p.phase2) * p.amp * 0.6;

      var vx = p.x + jx;
      var vy = p.y + jy;
      var vz = p.z + jz;

      var r1 = rotateY(vx, vy, vz, angleY);
      var r2 = rotateX(r1.x, r1.y, r1.z, angleX);

      var scale = DPR * (W / 900);
      var proj = project(r2.x * scale, r2.y * scale, r2.z * scale);

      // subtle size pulsing to feel alive
      var pulse = 1 + Math.sin(t * p.freq * 1.5 + p.phase) * 0.12;
      var size = p.size * proj.scale * pulse * (W / 900);

      var alpha = Math.max(0.25, Math.min(1, proj.scale));
      var glow = 0;
      if (p.special) {
        // sharp lighthouse-style flash: long dim stretch, brief bright spike
        var envelope = Math.pow(Math.max(0, Math.sin(t * 0.9 + p.phase)), 8);
        alpha = 0.15 + 0.85 * envelope;
        glow = 0.35 + 0.65 * envelope;
      }

      drawList.push({ idx: i, x: proj.x, y: proj.y, size: size, alpha: alpha, glow: glow, z: r2.z, special: p.special });
    }

    drawList.sort(function (a, b) { return a.z - b.z; });

    // hit-test special stars against current mouse position
    hoveredIdx = -1;
    var bestDist = Infinity;
    for (var k = 0; k < drawList.length; k++) {
      if (!drawList[k].special) continue;
      var dx = drawList[k].x - mouseX;
      var dy = drawList[k].y - mouseY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var hitRadius = Math.max(18 * DPR, drawList[k].size);
      if (dist < hitRadius && dist < bestDist) {
        bestDist = dist;
        hoveredIdx = drawList[k].idx;
      }
    }
    canvas.style.cursor = hoveredIdx !== -1 ? 'pointer' : 'default';

    for (var j = 0; j < drawList.length; j++) {
      var d = drawList[j];

      if (d.special) {
        ctx.shadowColor = 'rgba(60,220,100,' + d.glow + ')';
        ctx.shadowBlur = 25 * d.glow * DPR;
        ctx.fillStyle = 'rgba(70,225,110,' + d.alpha + ')';
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,' + d.alpha + ')';
      }

      ctx.beginPath();
      ctx.arc(d.x, d.y, Math.max(0.5, d.size / 2), 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (d.idx === hoveredIdx) {
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.size / 2 + 10 * DPR, 0, Math.PI * 2);
        ctx.strokeStyle = '#2ecc71';
        ctx.lineWidth = 2 * DPR;
        ctx.stroke();

        ctx.font = (13 * DPR) + 'px Arial, sans-serif';
        ctx.fillStyle = '#2ecc71';
        ctx.textAlign = 'center';
        ctx.fillText(d.special.label, d.x, d.y - d.size / 2 - 16 * DPR);
      }
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bassmann.ooo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="favicon-animate.js" defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 16px;
    font-family: "Courier New", Courier, monospace;
    color: #fff;
    font-size: clamp(0.85rem, 3.2vw, 1.15rem);
    z-index: 1;
  }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 16px;
    font-family: "Courier New", Courier, monospace;
    color: #00ff00;
    font-size: clamp(0.7rem, 2.6vw, 0.95rem);
    text-align: center;
    z-index: 1;
    pointer-events: none;
  }
  .tab-hint {
    position: fixed;
    bottom: 16px;
    right: 16px;
    font-family: "Courier New", Courier, monospace;
    color: rgba(255, 255, 255, 0.4);
    font-size: clamp(0.7rem, 2.6vw, 0.95rem);
    z-index: 1;
    pointer-events: none;
  }
  .drag-hint {
    position: fixed;
    bottom: 42px;
    right: 16px;
    font-family: "Courier New", Courier, monospace;
    color: rgba(255, 255, 255, 0.4);
    font-size: clamp(0.7rem, 2.6vw, 0.95rem);
    z-index: 1;
    pointer-events: none;
  }

  /* phones: the right-aligned hints and centered footer collide when
     stacked at fixed pixel offsets, so stack all three bottom texts in a
     single centered column instead */
  @media (max-width: 600px) {
    footer {
      bottom: 44px;
      padding: 4px 12px;
      font-size: clamp(0.62rem, 3vw, 0.8rem);
    }
    .drag-hint {
      left: 0;
      right: 0;
      bottom: 24px;
      text-align: center;
      font-size: clamp(0.6rem, 2.8vw, 0.75rem);
    }
    .tab-hint {
      left: 0;
      right: 0;
      bottom: 6px;
      text-align: center;
      font-size: clamp(0.6rem, 2.8vw, 0.75rem);
    }
  }
</style>
</head>
<body>
<header>bassmann.ooo</header>
<footer id="target-footer">target: about me</footer>
<div class="drag-hint">click + drag to rotate</div>
<div class="tab-hint">use [tab] to cycle orblinks</div>
<canvas id="stars"></canvas>
<script>
(function () {
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var W, H, DPR;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = canvas.width = window.innerWidth * DPR;
    H = canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  var COUNT = 300;
  var FOCAL = 480;
  var points = [];

  function rand(min, max) { return min + Math.random() * (max - min); }

  // Box-Muller transform for normally-distributed random values
  function gaussianRandom(mean, stdev) {
    var u = 1 - Math.random();
    var v = Math.random();
    var z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    return z * stdev + mean;
  }

  // real star populations are dominated by small stars (e.g. red dwarfs) with
  // a rare long tail of much larger giants — a right-skewed normal (clamped
  // half-normal plus an occasional giant outlier) reads closer to that than
  // a flat/symmetric distribution would
  function starSize() {
    var s = Math.max(3, gaussianRandom(6, 2));
    if (Math.random() < 0.03) s += Math.abs(gaussianRandom(10, 4));
    return Math.min(s, 22);
  }

  // spherical distribution: concentrated toward center, evenly spread across
  // all three axes (no flattening), with a sparser halo of outliers
  for (var i = 0; i < COUNT; i++) {
    var isHalo = Math.random() < 0.15;
    var radius = isHalo ? rand(260, 420) : Math.pow(Math.random(), 1.8) * 260;
    var theta = rand(0, Math.PI * 2);
    var phi = Math.acos(rand(-1, 1));

    // ~25% of stars twinkle: a faster brightness flicker layered on top of
    // the normal size pulse, like real atmospheric scintillation
    var twinkles = Math.random() < 0.25;

    points.push({
      x: radius * Math.sin(phi) * Math.cos(theta),
      y: radius * Math.sin(phi) * Math.sin(theta),
      z: radius * Math.cos(phi),
      size: starSize(),
      phase: rand(0, Math.PI * 2),
      freq: rand(0.4, 1.1),
      amp: rand(4, 14),
      phase2: rand(0, Math.PI * 2),
      freq2: rand(0.3, 0.9),
      twinkleAmp: twinkles ? rand(0.3, 0.6) : 0,
      twinkleFreq: rand(2, 6),
      twinklePhase: rand(0, Math.PI * 2)
    });
  }

  // pick 3 random distinct points to become clickable "nav" stars
  var navDefs = [
    { label: 'about', url: 'about.html' },
    { label: 'artwork', url: 'https://kurt1s.artstation.com/' },
    { label: 'other stuff', url: 'https://github.com/Kurt1s/' }
  ];
  var specialIdx = [];
  while (specialIdx.length < navDefs.length) {
    var candidate = Math.floor(Math.random() * points.length);
    if (specialIdx.indexOf(candidate) === -1) specialIdx.push(candidate);
  }
  specialIdx.forEach(function (idx, n) {
    points[idx].special = navDefs[n];
    // chaotic mutual orbit: radius/angle both wobble at unrelated frequencies
    // so the three stars circle a shared point without ever settling into a
    // clean repeating pattern
    points[idx].orbit = {
      radius: rand(30, 55),
      ampR: rand(10, 20),
      freqR: rand(0.2, 0.5),
      speed: rand(0.18, 0.4) * (Math.random() < 0.5 ? 1 : -1),
      speed2: rand(0.4, 0.9),
      zAmp: rand(20, 40),
      zFreq: rand(0.25, 0.55),
      tiltPhase: rand(0, Math.PI * 2)
    };
  });

  // shared point the special stars orbit around
  var specialCentroid = { x: 0, y: 0, z: 0 };
  specialIdx.forEach(function (idx) {
    specialCentroid.x += points[idx].x;
    specialCentroid.y += points[idx].y;
    specialCentroid.z += points[idx].z;
  });
  specialCentroid.x /= specialIdx.length;
  specialCentroid.y /= specialIdx.length;
  specialCentroid.z /= specialIdx.length;

  // Pointer Events unify mouse, touch, and pen so drag/hover work the same
  // way on a phone screen as with a mouse
  var mouseX = -9999, mouseY = -9999;
  var hoveredIdx = -1;
  canvas.addEventListener('pointermove', function (e) {
    var rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * DPR;
    mouseY = (e.clientY - rect.top) * DPR;
  });
  canvas.addEventListener('pointerleave', function () {
    mouseX = -9999;
    mouseY = -9999;
  });

  // click/tap + drag to manually rotate the scene, with momentum on release
  var isDragging = false;
  var dragMoved = false;
  var lastDragX = 0, lastDragY = 0;
  var DRAG_SPEED = 0.005;
  var MOMENTUM_FRICTION = 0.95;
  var velY = 0, velX = 0;

  canvas.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    isDragging = true;
    dragMoved = false;
    velY = 0;
    velX = 0;
    lastDragX = e.clientX;
    lastDragY = e.clientY;
  });
  window.addEventListener('pointermove', function (e) {
    if (!isDragging) return;
    var dx = e.clientX - lastDragX;
    var dy = e.clientY - lastDragY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
    var stepY = dx * DRAG_SPEED;
    var stepX = dy * DRAG_SPEED;
    angleY += stepY;
    angleX += stepX;
    // smoothed velocity so a flick's momentum reflects the overall motion,
    // not just the last jittery sample right before release
    velY = velY * 0.7 + stepY * 0.3;
    velX = velX * 0.7 + stepX * 0.3;
    lastDragX = e.clientX;
    lastDragY = e.clientY;
  });
  window.addEventListener('pointerup', function (e) {
    if (e.button !== 0) return;
    isDragging = false;
  });

  canvas.addEventListener('click', function () {
    if (dragMoved) return;
    if (hoveredIdx !== -1) window.location.href = points[hoveredIdx].special.url;
  });

  // keyboard nav: Tab cycles through special stars (default = 'about'), Enter activates
  var footerLabels = ['about me', 'artwork', 'other stuff'];
  var targetFooter = document.getElementById('target-footer');
  var selectedOrder = 0;
  var selectedIdx = specialIdx[0];
  var ring = { x: 0, y: 0, r: 0, vx: 0, vy: 0, vr: 0, initialized: false };

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      selectedOrder = (selectedOrder + 1) % specialIdx.length;
      selectedIdx = specialIdx[selectedOrder];
      targetFooter.textContent = 'target: ' + footerLabels[selectedOrder];
    } else if (e.key === 'Enter') {
      var sp = points[selectedIdx];
      if (sp && sp.special) window.location.href = sp.special.url;
    }
  });

  var angleY = 0;
  var angleX = 0.3;
  var lastT = 0;

  // shooting stars: fast 2D screen-space streaks, independent of the
  // rotating 3D star field
  var shootingStars = [];
  var nextShootAt = rand(1, 3);

  function spawnShootingStar(t) {
    var margin = 60 * DPR;
    var edge = Math.floor(rand(0, 4));
    var x, y, angle;
    if (edge === 0) { x = rand(0, W); y = -margin; angle = rand(0.9, 2.2); }
    else if (edge === 1) { x = W + margin; y = rand(0, H); angle = rand(2.4, 3.9); }
    else if (edge === 2) { x = rand(0, W); y = H + margin; angle = rand(4.0, 5.4); }
    else { x = -margin; y = rand(0, H); angle = rand(-0.6, 0.6); }

    var speed = rand(700, 1300) * DPR;
    shootingStars.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: rand(2, 5) * DPR,
      born: t,
      life: rand(0.5, 0.9)
    });
  }

  function updateAndDrawShootingStars(t) {
    if (t > nextShootAt) {
      spawnShootingStar(t);
      nextShootAt = t + rand(1.5, 4.5);
    }

    for (var i = shootingStars.length - 1; i >= 0; i--) {
      var s = shootingStars[i];
      var age = t - s.born;
      if (age > s.life) {
        shootingStars.splice(i, 1);
        continue;
      }

      var curX = s.x + s.vx * age;
      var curY = s.y + s.vy * age;
      var fade = 1 - age / s.life;

      var tailX = curX - s.vx * 0.045;
      var tailY = curY - s.vy * 0.045;

      var trail = ctx.createLinearGradient(tailX, tailY, curX, curY);
      trail.addColorStop(0, 'rgba(255,255,255,0)');
      trail.addColorStop(1, 'rgba(255,255,255,' + fade + ')');
      ctx.strokeStyle = trail;
      ctx.lineWidth = s.size * 0.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(curX, curY);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(curX, curY, s.size / 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + fade + ')';
      ctx.fill();
    }
  }

  function project(px, py, pz) {
    var scale = FOCAL / (FOCAL + pz);
    return {
      x: W / 2 + px * scale,
      y: H / 2 + py * scale,
      scale: scale
    };
  }

  function rotateY(x, y, z, a) {
    var cosA = Math.cos(a), sinA = Math.sin(a);
    return {
      x: x * cosA + z * sinA,
      y: y,
      z: -x * sinA + z * cosA
    };
  }

  function rotateX(x, y, z, a) {
    var cosA = Math.cos(a), sinA = Math.sin(a);
    return {
      x: x,
      y: y * cosA - z * sinA,
      z: y * sinA + z * cosA
    };
  }

  function draw(t) {
    t *= 0.001;
    ctx.clearRect(0, 0, W, H);
    angleY += 0.0045;

    // inertia: momentum from the last drag keeps spinning the scene and
    // decays via friction, instead of stopping dead the instant you let go
    if (!isDragging && (velY !== 0 || velX !== 0)) {
      angleY += velY;
      angleX += velX;
      velY *= MOMENTUM_FRICTION;
      velX *= MOMENTUM_FRICTION;
      if (Math.abs(velY) < 0.00005) velY = 0;
      if (Math.abs(velX) < 0.00005) velX = 0;
    }

    var drawList = [];

    for (var i = 0; i < points.length; i++) {
      var p = points[i];

      var vx, vy, vz;
      if (p.orbit) {
        // chaotic mutual orbit around the shared centroid: angle and radius
        // both carry a second, unrelated wobble term so the motion never
        // repeats cleanly
        var angle = t * p.orbit.speed + Math.sin(t * p.orbit.speed2 + p.phase) * 1.3;
        var orbR = p.orbit.radius + Math.sin(t * p.orbit.freqR + p.phase2) * p.orbit.ampR;
        vx = specialCentroid.x + orbR * Math.cos(angle);
        vy = specialCentroid.y + orbR * Math.sin(angle);
        vz = specialCentroid.z + p.orbit.zAmp * Math.sin(t * p.orbit.zFreq + p.orbit.tiltPhase + angle * 0.5);
      } else {
        // organic vibration: small per-point wobble in all three axes
        var jx = Math.sin(t * p.freq + p.phase) * p.amp;
        var jy = Math.cos(t * p.freq2 + p.phase2) * p.amp;
        var jz = Math.sin(t * p.freq * 0.7 + p.phase2) * p.amp;
        vx = p.x + jx;
        vy = p.y + jy;
        vz = p.z + jz;
      }

      var r1 = rotateY(vx, vy, vz, angleY);
      var r2 = rotateX(r1.x, r1.y, r1.z, angleX);

      var scale = DPR * (W / 900);
      var proj = project(r2.x * scale, r2.y * scale, r2.z * scale);

      // subtle size pulsing to feel alive
      var pulse = 1 + Math.sin(t * p.freq * 1.5 + p.phase) * 0.12;
      var size = p.size * proj.scale * pulse * (W / 900);

      var alpha = Math.max(0.8, Math.min(1, proj.scale));
      if (p.twinkleAmp > 0) {
        var flicker = 0.5 + 0.5 * Math.sin(t * p.twinkleFreq + p.twinklePhase);
        alpha *= 1 - p.twinkleAmp * flicker;
      }
      var glow = 0;
      if (p.special) {
        // mostly bright, with only brief gentle dips instead of long dim stretches
        var raw = 0.5 + 0.5 * Math.sin(t * 0.9 + p.phase);
        var envelope = Math.pow(raw, 0.35);
        alpha = 0.55 + 0.45 * envelope;
        glow = 0.6 + 0.4 * envelope;
        size *= 2.6;
      }

      drawList.push({ idx: i, x: proj.x, y: proj.y, size: size, alpha: alpha, glow: glow, z: r2.z, special: p.special });
    }

    // painter's algorithm: draw farthest (largest z) first so nearer spheres
    // are drawn on top and properly occlude the ones behind them
    drawList.sort(function (a, b) { return b.z - a.z; });

    // hit-test special stars against current mouse position
    hoveredIdx = -1;
    var bestDist = Infinity;
    for (var k = 0; k < drawList.length; k++) {
      if (!drawList[k].special) continue;
      var dx = drawList[k].x - mouseX;
      var dy = drawList[k].y - mouseY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var hitRadius = Math.max(18 * DPR, drawList[k].size);
      if (dist < hitRadius && dist < bestDist) {
        bestDist = dist;
        hoveredIdx = drawList[k].idx;
      }
    }
    canvas.style.cursor = hoveredIdx !== -1 ? 'pointer' : 'default';

    // spring-animate the keyboard-selection ring toward the selected star's live position
    var dt = Math.min(Math.max(t - lastT, 0), 0.05);
    lastT = t;
    var target = null;
    for (var s = 0; s < drawList.length; s++) {
      if (drawList[s].idx === selectedIdx) { target = drawList[s]; break; }
    }
    if (target) {
      var targetR = Math.max(0.5, target.size / 2) + 10 * DPR;
      if (!ring.initialized) {
        ring.x = target.x; ring.y = target.y; ring.r = targetR;
        ring.vx = ring.vy = ring.vr = 0;
        ring.initialized = true;
      } else {
        var STIFF = 320, DAMP = 24;
        var ax = (target.x - ring.x) * STIFF - ring.vx * DAMP;
        var ay = (target.y - ring.y) * STIFF - ring.vy * DAMP;
        var ar = (targetR - ring.r) * STIFF - ring.vr * DAMP;
        ring.vx += ax * dt; ring.vy += ay * dt; ring.vr += ar * dt;
        ring.x += ring.vx * dt; ring.y += ring.vy * dt; ring.r += ring.vr * dt;
      }
    }

    for (var j = 0; j < drawList.length; j++) {
      var d = drawList[j];

      if (d.special) {
        var r = Math.max(0.5, d.size / 2);
        var haloR = r * (3 + 2.5 * d.glow);

        // real glow: radial gradient halo, not just canvas shadowBlur
        var gradient = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, haloR);
        gradient.addColorStop(0, 'rgba(90,255,140,' + (0.55 * d.glow) + ')');
        gradient.addColorStop(0.4, 'rgba(60,220,100,' + (0.28 * d.glow) + ')');
        gradient.addColorStop(1, 'rgba(60,220,100,0)');
        ctx.beginPath();
        ctx.arc(d.x, d.y, haloR, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.shadowColor = 'rgba(90,255,140,' + d.glow + ')';
        ctx.shadowBlur = 20 * d.glow * DPR;
        ctx.fillStyle = 'rgba(120,255,160,' + d.alpha + ')';
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,' + d.alpha + ')';
      }

      ctx.beginPath();
      ctx.arc(d.x, d.y, Math.max(0.5, d.size / 2), 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (d.idx === hoveredIdx) {
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.size / 2 + 10 * DPR, 0, Math.PI * 2);
        ctx.strokeStyle = '#2ecc71';
        ctx.lineWidth = 2 * DPR;
        ctx.stroke();

        ctx.font = (13 * DPR) + 'px Arial, sans-serif';
        ctx.fillStyle = '#2ecc71';
        ctx.textAlign = 'center';
        ctx.fillText(d.special.label, d.x, d.y - d.size / 2 - 16 * DPR);
      }
    }

    // keyboard-selection ring: follows the selected star via spring physics
    if (ring.initialized) {
      var ringR = Math.max(0.5, ring.r);
      var DIVISIONS = 32;
      var segment = (2 * Math.PI * ringR) / DIVISIONS;

      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = '#5ad1ff';
      ctx.lineWidth = 2 * DPR;
      ctx.setLineDash([segment / 2, segment / 2]);
      ctx.stroke();
      ctx.setLineDash([]);

      if (hoveredIdx !== selectedIdx) {
        var selPt = points[selectedIdx];
        ctx.font = (13 * DPR) + 'px Arial, sans-serif';
        ctx.fillStyle = '#5ad1ff';
        ctx.textAlign = 'center';
        ctx.fillText(selPt.special.label, ring.x, ring.y - ring.r - 6 * DPR);
      }
    }

    updateAndDrawShootingStars(t);

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
